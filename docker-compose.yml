services:
  api:
    build: .
    container_name: e-ticaret-api-container
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    container_name: e-ticaret-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: e-ticaret-redis
    ports:
      - "6379:6379"

volumes:
  ecommerce_postgres_data:


  